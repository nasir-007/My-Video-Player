name: Build KinoX Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Test & Build APK (Android 10 - 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create local.properties for Gradle
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate debug keystore if missing
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -storetype PKCS12 \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -keystore debug.keystore \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests (API 29 & API 36)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload KinoX APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinoX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
