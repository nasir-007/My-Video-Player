name: Build KinoX Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Pure-JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          sdkmanager "platforms;android-36.1" || true

      - name: Prepare debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Skip hardware/Robolectric tests in CI; run pure-JVM unit tests only.
      # External google-services.json is not needed because googleServices uses
      # MissingGoogleServicesStrategy.WARN and googleServices.missing.passthrough=true.
      - name: Run pure-JVM unit tests
        run: >
          gradle :app:testDebugUnitTest
          --tests "com.example.ExampleUnitTest"
          --tests "com.example.SubtitleParserTest"
          --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload KinoX APK
        uses: actions/upload-artifact@v4
        with:
          name: KinoX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
